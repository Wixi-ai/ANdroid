name: Build and Push APK to RuStore

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEY_STORE }}" | base64 --decode > my-release-key.jks

    # Автоматически определяем алиас ключа из файла jks и собираем проект
    - name: Build and Sign Release APK
      run: |
        chmod +x gradlew
        
        # Утилита keytool сама вытащит точное имя алиаса из jks
        DETECTED_ALIAS=$(keytool -list -v -keystore my-release-key.jks -storepass "${{ secrets.KEY_STORE_PASSWORD }}" | grep "Alias name:" | head -n 1 | cut -d ' ' -f 3- | tr -d '\r\n')
        echo "Detected key alias: '$DETECTED_ALIAS'"
        
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/my-release-key.jks \
          -Pandroid.injected.signing.store.password="${{ secrets.KEY_STORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="$DETECTED_ALIAS" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_STORE_PASSWORD }}"

    # Используем официальный готовый экшен публикации от RuStore
    - name: Upload APK to RuStore
      uses: RuStore/rustore-publish-action@v1.2.0
      with:
        key-id: ${{ secrets.RUSTORE_KEY_ID }}
        private-key: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        app-id: "com.example.betpro"
        file-path: "app/build/outputs/apk/release/app-release.apk"
        whats-new: "Автоматическое обновление из GitHub Actions"
        publish-type: "MANUAL"
