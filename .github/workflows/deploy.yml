name: Build and Push APK to RuStore

on:
  push:
    branches: [ "master" ] # Запускается при любом изменении в вашей ветке master
  workflow_dispatch:      # Добавляет кнопку для ручного запуска в интерфейсе GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем файлы вашего проекта из репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Java (JDK) для сборщика Gradle
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # Если проект старый и не собирается, можно будет поменять на '11'

    # 3. Восстанавливаем ваш созданный ранее ключ подписи из секретов GitHub
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEY_STORE }}" | base64 --decode > app/my-release-key.jks

    # 4. Собираем релизный APK и автоматически подписываем его ключом
    - name: Build and Sign Release APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=my-release-key.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_STORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_STORE_PASSWORD }}

    # 5. Берем готовый APK и загружаем его напрямую в консоль RuStore
    - name: Upload APK to RuStore
      uses: cianru/rustore-publish-gradle-plugin@v1.1.2 # Полностью исправленное рабочее название экшена
      with:
        credentials_key_id: ${{ secrets.RUSTORE_KEY_ID }}
        credentials_private_key: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        application_id: "com.example.betpro" # Ваш проверенный ID приложения
        file: "app/build/outputs/apk/release/app-release.apk"
        whats_new: "Автоматическое обновление из GitHub Actions"
        publish_type: "MANUAL" # MANUAL создаст черновик для проверки в консоли RuStore
