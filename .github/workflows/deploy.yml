name: Build and Push APK to RuStore

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEY_STORE }}" | base64 --decode > my-release-key.jks

    # Автоматически определяем алиас ключа из файла jks и собираем проект
    - name: Build and Sign Release APK
      run: |
        chmod +x gradlew
        
        # Утилита keytool сама вытащит точное имя алиаса из jks
        DETECTED_ALIAS=$(keytool -list -v -keystore my-release-key.jks -storepass "${{ secrets.KEY_STORE_PASSWORD }}" | grep "Alias name:" | head -n 1 | cut -d ' ' -f 3- | tr -d '\r\n')
        echo "Detected key alias: '$DETECTED_ALIAS'"
        
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/my-release-key.jks \
          -Pandroid.injected.signing.store.password="${{ secrets.KEY_STORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="$DETECTED_ALIAS" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_STORE_PASSWORD }}"

    # Прямая загрузка APK в RuStore через официальный API без сторонних плагинов
    - name: Upload APK to RuStore via API
      run: |
        echo "Получаем токен авторизации..."
        AUTH_RESPONSE=$(curl -s -X POST "https://vkplay.ru" \
          -H "Content-Type: application/json" \
          -d "{\"keyId\":\"${{ secrets.RUSTORE_KEY_ID }}\",\"privateKey\":\"${{ secrets.RUSTORE_PRIVATE_KEY }}\"}")
          
        TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.body.jws')
        
        if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
          echo "Ошибка авторизации в RuStore: $AUTH_RESPONSE"
          exit 1
        fi
        
        echo "Загружаем APK-файл..."
        UPLOAD_RESPONSE=$(curl -s -X POST "https://vkplay.ru" \
          -H "Authorization: Bearer $TOKEN" \
          -F "file=@app/build/outputs/apk/release/app-release.apk" \
          -F "publishType=MANUAL" \
          -F "whatsNew=Автоматическое обновление из GitHub Actions")
          
        echo "Ответ сервера RuStore: $UPLOAD_RESPONSE"
