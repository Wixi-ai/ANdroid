name: Generate Keystore

on:
  workflow_dispatch: # Позволяет запустить генерацию вручную кнопкой

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
    - name: Generate JKS File
      run: |
        keytool -genkey -v -keystore auto-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass mysecretpassword -keypass mysecretpassword -dname "CN=Developer, O=App, C=RU"
    
    - name: Convert to Base64
      run: |
        echo "=== СКОПИРУЙТЕ СТРОКУ НИЖЕ (БЕЗ ПРОБЕЛОВ) ==="
        cat auto-release-key.jks | base64 -w 0
        echo ""
        echo "=== КОНЕЦ СТРОКИ ==="
